<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>B站视频总结设置</title><style>body{font:15px system-ui;max-width:620px;margin:50px auto;color:#172033}label{display:block;margin:18px 0 6px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd4e2;border-radius:8px}button{margin-top:22px;padding:10px 20px;background:#fb7299;color:#fff;border:0;border-radius:8px}small{display:block;color:#718096;margin-top:8px;line-height:1.5}</style><h1>B站视频总结设置</h1><p>本插件使用 SiliconFlow，同时支持视频总结和无字幕语音识别。请填写你自己的 SiliconFlow API Key。</p><label for="apiKey">SiliconFlow API Key</label><input id="apiKey" type="password" autocomplete="off"><label for="model">文本总结模型</label><input id="model" placeholder="Qwen/Qwen3.5-4B（免费模型）"><small>默认推荐 Qwen/Qwen3.5-4B，这是 SiliconFlow 的免费模型选项；模型可用性以 SiliconFlow 当前状态为准。API Key 只保存在浏览器扩展存储中。无字幕视频使用 FunAudioLLM/SenseVoiceSmall 进行语音识别。</small><button id="save">保存设置</button><span id="saved"></span><script src="options.js"></script></html>
