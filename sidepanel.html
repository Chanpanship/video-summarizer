<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="sidepanel.css"></head><body><header><div class="brand"><img class="logo" src="icons/icon48.png" alt="Video Summarizer"><div><h1 data-i18n="title">视频总结</h1><p data-i18n="subtitle">视频、网课和讲座都可以总结</p></div></div><div class="header-actions"><button id="langToggle">EN</button><button id="settings" data-i18n="settings">设置</button></div></header><section id="video" class="video-card" data-i18n="reading">正在读取当前页面…</section><button id="summarize" class="primary" disabled data-i18n="summarize">生成总结</button><div id="status" class="status"></div><nav><button class="active" data-view="summary" data-i18n="summaryTab">总结</button><button data-view="transcript" data-i18n="textTab">原始文本</button><button data-view="chat" data-i18n="chatTab">继续追问</button></nav><section id="summary" class="view"></section><pre id="transcript" class="view" hidden></pre><section id="chat" class="view" hidden><div id="messages" class="messages"></div><form id="chatForm"><textarea id="question" rows="3" data-i18n-placeholder="questionPlaceholder" placeholder="针对这个视频继续提问"></textarea><button data-i18n="send">发送</button></form></section><script src="sidepanel.js"></script></body></html>
